<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PrepMate AI — Prepare. Practice. Perform.</title>
    <meta
      name="description"
      content="Practice realistic developer interviews, answer questions, and get AI-powered feedback on where you can improve."
    />
    <meta name="theme-color" content="#090d16" />
    <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/screens.css') }}" />
    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>

    <header class="site-header">
      <div class="container">
        <a class="brand" href="#/" aria-label="PrepMate AI home">
          <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="" />
          <span>PrepMate <span class="accent">AI</span></span>
        </a>
        <nav class="site-nav" aria-label="Main">
          <span class="chip chip--ai hide-sm"><span class="pulse-dot"></span>AI interview practice</span>
          <a class="btn btn--primary btn--sm" href="#/start">Start</a>
        </nav>
      </div>
    </header>

    <main id="app" tabindex="-1">
      <noscript>
        <section class="container state-page">
          <div class="card state-card">
            <h1>PrepMate needs JavaScript</h1>
            <p class="muted">Please enable JavaScript to run your interview.</p>
          </div>
        </section>
      </noscript>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span class="tagline">PREPARE. PRACTICE. PERFORM.</span>
        <span>AI scores are practice feedback, not an employment evaluation.</span>
      </div>
    </footer>
  </body>
</html>
